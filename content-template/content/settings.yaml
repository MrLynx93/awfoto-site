heroEyebrow: Fotografia rodzinna i plenerowa
heroHeading: Światło, które zostaje na lata
heroText: >-
  Fotografuję tak, jak lubię wspominać — miękko, ciepło i bez pozowania.
  Sesje w plenerze, w domu i w studiu.
aboutHeading: Cześć, tu Ania
aboutText: >-
  Od ośmiu lat fotografuję rodziny, dzieci i pary. Nie ustawiam sztywnych póz —
  wolę poczekać, aż wydarzy się coś prawdziwego. Na sesji jest luźno, dzieci mogą
  biegać, a Wy nie musicie wiedzieć, co zrobić z rękami.
