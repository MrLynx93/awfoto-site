name: build and deploy

# Runs on a push to this repo, and on a repository_dispatch fired by the
# content repo whenever the panel saves something.
on:
  push:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

env:
  # The only place the domain is configured. Set the repository variable
  # SITE_DOMAIN to change it everywhere: the canonical URLs baked into the
  # build, both rsync targets, and the panel restart. PANEL_DOMAIN is derived
  # unless you override it with a variable of its own.
  SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'aw-foto.pl' }}
  PANEL_DOMAIN: ${{ vars.PANEL_DOMAIN || format('panel.{0}', vars.SITE_DOMAIN || 'aw-foto.pl') }}
  # The content repo, named directly. Split into owner and name because the
  # build needs them separately from the checkout.
  CONTENT_OWNER: MrLynx93
  CONTENT_NAME: awfoto-site-content

concurrency:
  # A newer save supersedes an in-flight build; never deploy out of order.
  group: deploy
  cancel-in-progress: true

jobs:
  # One build serves both deploys: output:'static' plus the node adapter emits
  # dist/client (the public site) and dist/server (the panel) in a single pass,
  # so building twice would only duplicate work.
  build:
    # Only the default branch deploys. Compared against the repo's actual
    # default rather than a hardcoded 'main', so renaming it does not quietly
    # stop every deploy. Skipping this job skips both deploys with it.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Checks with the API only — deliberately no git. actions/checkout above
      # persists http.https://github.com/.extraheader in .git/config carrying
      # the workflow's own GITHUB_TOKEN, and any git command run from this
      # directory sends that header instead of consulting a credential helper.
      # That token cannot see the private content repo, so git answers 404 and
      # the check fails even when CONTENT_REPO_TOKEN is perfectly good.
      - name: Verify access to the content repo
        env:
          TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -uo pipefail
          repo="${CONTENT_OWNER}/${CONTENT_NAME}"

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Brak sekretu CONTENT_REPO_TOKEN w repo z kodem."
            exit 1
          fi

          api() {
            curl -sS -o /tmp/body.json -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}$1" || echo 000
          }

          code=$(api "")
          echo "GET /repos/${repo} -> HTTP ${code}"
          case "$code" in
            200) ;;
            401) echo "::error::401 — token odrzucony. CONTENT_REPO_TOKEN jest nieprawidłowy, wygasł, albo wklejono go ze spacją."; exit 1 ;;
            403) echo "::error::403 — token nie ma uprawnienia Contents: Read do ${repo}."; exit 1 ;;
            404) echo "::error::404 — token nie widzi ${repo}. Sprawdź, czy w tokenie zaznaczono to repo w 'Only select repositories', oraz czy CONTENT_OWNER/CONTENT_NAME na górze deploy.yml są poprawne."; exit 1 ;;
            *)   echo "::error::Nieoczekiwana odpowiedź API (${code}) dla ${repo}."; head -c 400 /tmp/body.json; exit 1 ;;
          esac

          code=$(api "/branches?per_page=1")
          if [ "$code" != "200" ]; then
            echo "::error::Nie mogę odczytać gałęzi ${repo} (HTTP ${code})."
            head -c 400 /tmp/body.json
            exit 1
          fi
          if grep -q '^\[\s*\]$' /tmp/body.json; then
            echo "::error::Repo ${repo} jest puste. Zasiej je najpierw: ./scripts/seed-content-repo.sh"
            exit 1
          fi

          echo "OK — ${repo} jest dostępne i ma treść."

      - name: Check out content (private repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTENT_OWNER }}/${{ env.CONTENT_NAME }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: site-content

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The content repo resizes photos on push, so this should always pass.
      # Kept as a net in case content ever lands without going through it.
      - name: Check photo sizes
        run: npm run images:check

      # PUBLIC_* vars are baked into the bundle here, not read from the
      # server's .env at runtime: keystatic.config.ts ships to the browser,
      # so import.meta.env is statically replaced at build time.
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://${{ env.SITE_DOMAIN }}
          PUBLIC_CONTENT_REPO_OWNER: ${{ env.CONTENT_OWNER }}
          PUBLIC_CONTENT_REPO_NAME: ${{ env.CONTENT_NAME }}

      # The whole tree, because the panel deploy rsyncs the app itself, not
      # just dist/. node_modules is reinstalled on the server; .git is useless
      # there and large.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: app
          retention-days: 1
          include-hidden-files: true
          path: |
            .
            !node_modules
            !.git

  # The public site: static files only, served straight by nginx so no photo
  # request ever touches Node. Runs on every trigger, including content saves.
  deploy-site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MYDEVIL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.MYDEVIL_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload site
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/client/ \
            "${{ secrets.MYDEVIL_USER }}@${{ secrets.MYDEVIL_HOST }}:domains/${{ env.SITE_DOMAIN }}/public_html/"

  # The panel: only its own code changes matter, and it reads content from
  # GitHub at runtime rather than from disk. So a content save must not touch
  # it — redeploying would restart the app underneath whoever is editing.
  deploy-panel:
    needs: build
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MYDEVIL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.MYDEVIL_HOST }}" >> ~/.ssh/known_hosts

      # The whole app, because Keystatic's API routes need Node.
      # node_modules and .env stay on the server between deploys.
      - name: Upload panel
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.git' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ \
            "${{ secrets.MYDEVIL_USER }}@${{ secrets.MYDEVIL_HOST }}:domains/${{ env.PANEL_DOMAIN }}/public_nodejs/"

      # Writes the panel's .env from GitHub secrets, so it can be set up without
      # SSH. Skipped entirely when the OAuth client id secret is unset, so it
      # can never blank out a working .env that was created by hand.
      #
      # KEYSTATIC_SECRET signs panel sessions and only has to be stable, not
      # known: if the secret is unset we keep whatever is already on the server,
      # and generate one on the first deploy. Setting it as a repository secret
      # overrides both.
      - name: Write the panel's .env
        env:
          CLIENT_ID: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.KEYSTATIC_SECRET }}
          SSH_TARGET: ${{ secrets.MYDEVIL_USER }}@${{ secrets.MYDEVIL_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${CLIENT_ID:-}" ]; then
            echo "::notice::KEYSTATIC_GITHUB_CLIENT_ID nie jest ustawiony — pomijam zapis .env"
            exit 0
          fi

          remote="domains/${PANEL_DOMAIN}/public_nodejs"
          ssh_cmd="ssh -i ~/.ssh/id_ed25519 $SSH_TARGET"

          # Keep the session key already on the server, so deploying does not
          # log the photographer out of the panel.
          existing=$($ssh_cmd "sed -n 's/^KEYSTATIC_SECRET=//p' $remote/.env 2>/dev/null | head -1" || true)
          secret="${SESSION_SECRET:-}"
          [ -n "$secret" ] || secret="$existing"
          [ -n "$secret" ] || secret=$(openssl rand -hex 32)

          # printf, not a heredoc: a secret containing shell metacharacters is
          # then just data, never something the shell re-reads.
          umask 077
          {
            printf 'SITE_URL=https://%s\n' "$SITE_DOMAIN"
            printf 'KEYSTATIC_GITHUB_CLIENT_ID=%s\n' "$CLIENT_ID"
            printf 'KEYSTATIC_GITHUB_CLIENT_SECRET=%s\n' "$CLIENT_SECRET"
            printf 'KEYSTATIC_SECRET=%s\n' "$secret"
            printf 'PANEL_ONLY=true\n'
          } > panel.env

          scp -i ~/.ssh/id_ed25519 panel.env "$SSH_TARGET:$remote/.env"
          rm -f panel.env
          $ssh_cmd "chmod 600 $remote/.env"

      - name: Install panel dependencies and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.MYDEVIL_USER }}@${{ secrets.MYDEVIL_HOST }}" \
            "cd domains/${{ env.PANEL_DOMAIN }}/public_nodejs && npm ci --omit=dev && devil www restart ${{ env.PANEL_DOMAIN }}"
