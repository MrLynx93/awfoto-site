name: Zasiej repo z treścią

# One-off, manual only. Pushes content-template/ into the private content repo
# so the panel has something to show on first load. Exists so the whole setup
# can be done from a browser — the alternative is running
# scripts/seed-content-repo.sh from a terminal, which does the same thing.
#
# Needs CONTENT_REPO_TOKEN to have *write* access to the content repo. The
# deploy only ever reads, so a read-only token is enough for everything else;
# you can drop this permission back to read-only once seeding is done.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Wpisz nazwę repo z treścią, żeby potwierdzić'
        required: true

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      CONTENT_OWNER: ${{ vars.CONTENT_REPO_OWNER || 'MrLynx93' }}
      CONTENT_NAME: ${{ vars.CONTENT_REPO_NAME || 'awfoto-site-content' }}
    steps:
      - uses: actions/checkout@v4

      # Typing the repo name is the guard against firing this by accident from
      # the Actions tab. The script refuses to overwrite existing content too,
      # but a wrong *target* is the mistake this catches.
      - name: Sprawdź potwierdzenie
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$CONTENT_NAME" ]; then
            echo "::error::Wpisano '$CONFIRM', a oczekiwano '$CONTENT_NAME'. Nic nie zrobiono."
            exit 1
          fi

      - name: Zasiej treść startową
        env:
          SEED_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          GIT_AUTHOR_NAME: AW Fotografia
          GIT_AUTHOR_EMAIL: noreply@aw-foto.pl
        run: |
          set -euo pipefail
          if [ -z "${SEED_TOKEN:-}" ]; then
            echo "::error::Brak sekretu CONTENT_REPO_TOKEN."
            exit 1
          fi

          # A credential helper, not a token in the URL: the URL would end up in
          # git's own error messages and in the remote config.
          git config --global credential.helper \
            '!f() { echo username=x-access-token; echo "password=$SEED_TOKEN"; }; f'

          ./scripts/seed-content-repo.sh \
            "https://github.com/${CONTENT_OWNER}/${CONTENT_NAME}.git"

      - name: Co dalej
        run: |
          echo "::notice::Gotowe. Ustaw teraz CODE_REPO_TOKEN w repo z treścią, potem uruchom 'Build i deploy'."
